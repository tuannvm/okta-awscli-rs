[package]
name = "okta-awscli-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
async-trait = "0.1.88"
authenticator = { version = "0.5.0", default-features = false, features = ["crypto_rust"] }
aws-config = { version = "1.8.3", default-features = false, features = ["behavior-version-latest", "credentials-process", "default-https-client", "rt-tokio", "sso"] }
aws-credential-types = "1.2.3"
aws-sdk-iam = { version = "1.87.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1.104.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.40", features = ["derive", "env"] }
dialoguer = "0.11.0"
dirs = "6.0.0"
env_logger = "0.11.8"
html-escape = "0.2.13"
log = "0.4.27"
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
pkcs8 = { version = "0.10.2", features = ["encryption"] }
quick-xml = "0.38.0"
regex = "1.11.1"
reqwest = { version = "0.12.20", default-features = false, features = ["cookies", "json", "rustls-tls"] }
rpassword = "7.4.0"
scraper = "0.23.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tokio = { version = "1.45.1", features = ["macros", "process", "rt-multi-thread", "time"] }
tungstenite = "0.28.0"
url = "2.5.4"
zeroize = "1.8.1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.20.0"
wiremock = "0.6.3"
